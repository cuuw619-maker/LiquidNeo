name: LiquidNeo Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle --no-daemon build
      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiquidNeo-JARs
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
