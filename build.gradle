plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            programArguments.addAll('--mod', project.mod_id)
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Architectury is a hard compile/runtime dependency. NeoForge enforces
    // the corresponding mandatory dependency in neoforge.mods.toml.
    implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"

    // Sodium integration is not compiled into this build yet. Keeping a
    // nonexistent Modrinth Maven coordinate here prevents Gradle resolution.
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}

processResources {
    def props = [
        version: project.mod_version,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_authors: project.mod_authors,
        mod_description: project.mod_description,
        neoforge_version_range: project.neoforge_version_range,
        minecraft_version_range: project.minecraft_version_range,
        loader_version_range: project.loader_version_range
    ]

    inputs.properties(props)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.mod_id}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            artifactId = project.mod_id
        }
    }
}
